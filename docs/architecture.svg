<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>网球订场系统分层架构</title>
<desc>五层结构：浏览器界面、HTTP 服务层、三个并列的能力模块、配置账号库、外部站点</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="140" y="30" width="400" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="48" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">浏览器界面 index.html</text>
<text x="340" y="66" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">1195 行 · 参数填写、日志与结果展示</text>

<path d="M340 86 V104" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="106" width="400" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="124" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">HTTP 服务层 app_server.py</text>
<text x="340" y="142" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">1166 行 · 22 个路由 · 任务线程与互斥锁</text>

<path d="M340 162 V176" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M135 176 H545" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M135 176 V188" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 176 V188" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M545 176 V188" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="190" width="190" height="56" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="135" y="208" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#173404">抢单内核</text>
<text x="135" y="226" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3B6D11">booker.py · 1674 行</text>

<rect x="245" y="190" width="190" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="208" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">浏览器登录</text>
<text x="340" y="226" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">browserlogin.py · 981 行</text>

<rect x="450" y="190" width="190" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="545" y="208" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">抓包取 token</text>
<text x="545" y="226" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">tokencap.py · 562 行</text>

<path d="M135 246 V258" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M545 246 V258" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M135 258 H545" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M340 246 V266" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="268" width="400" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="286" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">配置与账号库 accounts.py</text>
<text x="340" y="304" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">394 行 · 多账号参数、白名单迁移</text>

<path d="M340 324 V332" fill="none" stroke="#888780" stroke-width="1.5"/>
